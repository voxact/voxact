<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品与访谈 | 译声</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkCarbon: '#121212', neutralGray: '#777777', lightGray: '#E5E5E5' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    borderRadius: { 'xl-card': '16px', 'hero-round': '24px' }
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans text-darkCarbon overflow-x-hidden">

<!-- 顶部导航（保持你的三段式胶囊） -->
<header class="fixed top-0 left-0 w-full z-50 pointer-events-none">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between gap-4">
        <div class="pointer-events-auto bg-darkCarbon/50 backdrop-blur-2xl rounded-full px-6 py-3 shadow-2xl border border-white/20 flex items-center">
            <a href="index.html" class="hover:opacity-80 transition flex items-center">
    <img src="assets/images/logo/logo_yisheng.png" alt="译声" class="h-7 w-auto object-contain">
</a>
        </div>
        <nav class="pointer-events-auto hidden md:flex items-center gap-x-4 bg-darkCarbon/50 backdrop-blur-2xl rounded-full px-4 py-2 shadow-2xl border border-white/20">
            <a href="index.html" class="px-5 py-2 rounded-full text-white/70 hover:bg-white/20 hover:text-white transition text-sm">首页</a>
            <a href="library-acting.html" class="px-5 py-2 rounded-full text-white/70 hover:bg-white/20 hover:text-white transition text-sm">译声资料库</a>
            <a href="drama.html" class="px-5 py-2 rounded-full text-white/70 hover:bg-white/20 hover:text-white transition text-sm">剧目化训练</a>
            <!-- 当前页面高亮 -->
            <a href="works.html" class="px-5 py-2 rounded-full bg-white/30 text-white font-medium text-sm">作品与访谈</a>
        </nav>
        <div class="pointer-events-auto bg-darkCarbon/50 backdrop-blur-2xl rounded-full shadow-2xl border border-white/20">
            <a href="index.html" class="block px-6 py-3 text-white text-sm font-medium flex items-center gap-2">
                返回首页 <i class="fa fa-arrow-left"></i>
            </a>
        </div>
    </div>
</header>

<!-- ================= 视图 1：作品列表 ================= -->
<div id="view-list" class="pt-32 pb-24 bg-lightGray/30 min-h-screen">
    <div class="container mx-auto px-4 max-w-6xl">
        <div class="text-center mb-16">
            <div class="inline-flex items-center gap-2 border border-darkCarbon rounded-full px-3 py-1 text-sm mb-4">
                <i class="fa fa-headphones"></i>
                <span>译声作品库</span>
            </div>
            <h1 class="text-[clamp(2rem,4vw,3rem)] font-bold mb-4">作品与主创访谈</h1>
            <p class="text-neutralGray max-w-xl mx-auto">聆听我们的作品，感受声音背后的故事。点击卡片查看主创信息与深度访谈。</p>
        </div>

        <!-- 列表容器 -->
        <div id="works-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- JS 动态渲染卡片 -->
        </div>
    </div>
</div>

<!-- ================= 视图 2：作品详情 ================= -->
<div id="view-detail" class="hidden pt-32 pb-24 bg-white min-h-screen">
    <div class="container mx-auto px-4 max-w-4xl">
        <!-- 返回按钮 -->
        <button onclick="showList()" class="mb-8 inline-flex items-center gap-2 text-sm font-medium text-neutralGray hover:text-darkCarbon transition bg-lightGray/50 px-4 py-2 rounded-full">
            <i class="fa fa-arrow-left"></i> 返回作品列表
        </button>

        <!-- 头部：封面与简介 -->
        <div class="grid md:grid-cols-2 gap-10 mb-16">
            <div class="rounded-xl-card overflow-hidden shadow-lg h-72 md:h-96">
                <img id="detail-cover" src="" alt="封面" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col justify-center">
                <div id="detail-tags" class="flex flex-wrap gap-2 mb-4">
                    <!-- 标签 -->
                </div>
                <h1 id="detail-title" class="text-3xl md:text-4xl font-bold mb-4"></h1>
                <p id="detail-intro" class="text-neutralGray leading-relaxed mb-8"></p>
                <a id="detail-listen" href="" target="_blank" class="inline-flex items-center justify-center gap-2 bg-darkCarbon text-white px-8 py-3 rounded-full font-medium hover:bg-black transition w-full md:w-max shadow-lg">
                    <i class="fa fa-play-circle"></i> 立即试听 / 观看
                </a>
            </div>
        </div>

        <!-- 主创团队区 -->
        <div class="mb-16">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <span class="w-1.5 h-6 bg-darkCarbon rounded-full"></span>
                主创团队
            </h2>
            <div id="detail-creators" class="grid sm:grid-cols-2 gap-4">
                <!-- JS 动态渲染主创 -->
            </div>
        </div>

        <!-- 访谈区 -->
        <div>
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <span class="w-1.5 h-6 bg-darkCarbon rounded-full"></span>
                主创访谈
            </h2>
            <div id="detail-interview" class="space-y-6">
                <!-- JS 动态渲染 Q&A -->
            </div>
        </div>
    </div>
</div>

<!-- 引入数据文件 -->
<script src="works-data.js"></script>

<script>
    // ================= 逻辑区域 =================

    // 1. 渲染列表页
    function renderList() {
        const container = document.getElementById('works-container');
        container.innerHTML = worksData.map(work => `
            <div onclick="showDetail('${work.id}')" class="bg-white rounded-xl-card overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer group hover:-translate-y-1 border border-lightGray/50">
                <div class="h-48 overflow-hidden relative">
                    <img src="${work.cover}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition"></div>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-2 group-hover:text-blue-600 transition">${work.title}</h3>
                    <p class="text-sm text-neutralGray line-clamp-2">${work.intro}</p>
                    <div class="mt-4 flex items-center text-sm font-medium text-darkCarbon gap-1">
                        查看详情与访谈 <i class="fa fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 2. 显示详情页
    function showDetail(id) {
        const work = worksData.find(w => w.id === id);
        if (!work) return;

        // 填充基础信息
        document.getElementById('detail-cover').src = work.cover;
        document.getElementById('detail-title').textContent = work.title;
        document.getElementById('detail-intro').textContent = work.intro;
        document.getElementById('detail-listen').href = work.listenLink;

        // 填充标签
        document.getElementById('detail-tags').innerHTML = work.tags.map(tag => 
            `<span class="text-xs bg-lightGray text-darkCarbon px-3 py-1 rounded-full font-medium">${tag}</span>`
        ).join('');

        // 填充主创团队
        document.getElementById('detail-creators').innerHTML = work.creators.map(creator => `
            <a href="${creator.link}" class="flex items-center gap-4 bg-white border border-lightGray p-4 rounded-xl-card hover:shadow-md transition">
                <img src="${creator.avatar}" class="w-16 h-16 rounded-full object-cover border-2 border-lightGray">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-lg">${creator.name}</span>
                        <span class="text-xs bg-darkCarbon text-white px-2 py-0.5 rounded">${creator.role}</span>
                    </div>
                    <p class="text-xs text-neutralGray mt-1">${creator.bio}</p>
                </div>
            </a>
        `).join('');

        // 填充访谈问答
        document.getElementById('detail-interview').innerHTML = work.interview.map(item => `
            <div class="bg-lightGray/30 rounded-xl-card p-6 border border-lightGray">
                <div class="flex gap-3 mb-3">
                    <span class="w-6 h-6 rounded bg-darkCarbon text-white flex items-center justify-center text-xs font-bold shrink-0">Q</span>
                    <h4 class="font-bold text-lg pt-0.5">${item.q}</h4>
                </div>
                <div class="flex gap-3">
                    <span class="w-6 h-6 rounded bg-neutralGray text-white flex items-center justify-center text-xs font-bold shrink-0">A</span>
                    <p class="text-neutralGray leading-relaxed pt-0.5">${item.a}</p>
                </div>
            </div>
        `).join('');

        // 切换视图
        document.getElementById('view-list').classList.add('hidden');
        document.getElementById('view-detail').classList.remove('hidden');
        window.scrollTo(0, 0); // 回到顶部
    }

    // 3. 返回列表页
    function showList() {
        document.getElementById('view-detail').classList.add('hidden');
        document.getElementById('view-list').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // 初始化渲染
    renderList();
</script>

</body>
</html>
